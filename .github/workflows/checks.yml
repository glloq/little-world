name: Validate Little World
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run generate:beta
      - run: git diff --exit-code -- maps/beta.project.json public/maps/beta.json public/maps/beta.project.json
      - run: npm run compile:map -- maps/default.json public/maps/default.json
      - run: git diff --exit-code -- public/maps
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser authoring and play smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/little-world-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/little-world/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
          npm run test:studio
          npm run test:gameplay
          npm run test:environment
          npm run test:local
          npm run test:characters
      - name: IndexedDB integration
        run: |
          npm run dev -- --host 127.0.0.1 --port 5189 --strictPort > /tmp/little-world-studio-dev.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5189/little-world/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/studio-storage.browser.mjs http://127.0.0.1:5189/little-world/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-artifacts
          path: /tmp/little-world-browser
