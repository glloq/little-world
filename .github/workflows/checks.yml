name: Validate Little World
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
# Keep only the latest commit's expensive browser matrix for each event/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check:impostors
      - run: npm run check:world-assets
      - run: npm run generate:audio
      - run: git diff --exit-code -- public/audio assets/audio docs/38-AUDIO-V2-INVENTAIRE.md
      - run: npm run check:audio-synth
      - run: npm run generate:beta
      - run: git diff --exit-code -- tests/fixtures/legacy-maps/authoring/beta.project.json tests/fixtures/legacy-maps/published/beta.json tests/fixtures/legacy-maps/published/beta.project.json
      - run: npm run generate:island
      - name: Inspect race placement on actual 4x3 km island (read-only)
        run: node --experimental-strip-types tools/report-race-terrain.mjs
      - run: git diff --exit-code -- maps/island.project.json public/maps/island
      - run: npm run generate:production-reference
      - run: git diff --exit-code -- tests/fixtures/legacy-maps/authoring/production-reference.project.json tests/fixtures/legacy-maps/published/production-reference.project.json tests/fixtures/legacy-maps/published/production-reference
      - run: npm run generate:b1
      - run: git diff --exit-code -- tests/fixtures/legacy-maps/authoring/b1-demo.project.json tests/fixtures/legacy-maps/published/b1-demo.project.json tests/fixtures/legacy-maps/published/b1-demo
      - run: git diff --exit-code -- public/maps
      - run: npm run assets:hamster
      - run: git diff --exit-code -- public/models/hamster.glb
      - run: npm run build
      - run: node tools/verify-static-build.mjs
      - run: npx playwright install --with-deps chromium
      - name: Stage regression fixtures in CI preview only (never on Pages)
        run: node tools/stage-test-maps.mjs dist/maps
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/little-world-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/little-world/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/little-world/ > /dev/null
      - name: Instrument controls (bag V3, HUD, P shortcut, audio)
        run: npm run test:instruments
      - name: Surf playable wave, board and tube browser acceptance
        run: npm run test:surf
      - name: Surf Island A/B/C browser acceptance and captures
        run: npm run test:surf-island
      - name: Alpine lift, harvest sowing and editable island browser acceptance
        run: node tools/test-expansion-islands-browser.mjs
      - name: Ferry timetable, map, rowboat and cinematic preview (solo)
        run: node tools/test-ferry-browser.mjs
      - name: Real ferry journey A to B to A (static Pages, saves and map)
        run: node tools/test-island-travel-browser.mjs
      - name: Compiled application startup checks
        run: node tools/run-browser-check.mjs published
      - name: Studio browser checks
        run: node tools/run-browser-check.mjs studio
      - name: Studio hamster motion lab (presets, WebGL and project isolation)
        run: node tools/test-hamster-motion-lab-browser.mjs
      - name: Gameplay and saves browser checks
        run: node tools/run-browser-check.mjs gameplay
      - name: Player interface browser checks
        run: node tools/run-browser-check.mjs ui
      - name: Studio race courses compile and runtime smoke test
        run: node --experimental-strip-types tools/test-races-browser.mjs
      - name: Environment browser checks
        run: node tools/run-browser-check.mjs environment
      - name: Local viewport browser checks
        run: node tools/run-browser-check.mjs local
      - name: Character authoring browser checks
        run: node tools/run-browser-check.mjs characters
      - name: Water authoring browser checks
        run: node tools/run-browser-check.mjs water
      - name: Audio browser checks
        run: node tools/run-browser-check.mjs audio
      - name: Island lot 1 browser checks
        run: node tools/run-browser-check.mjs island
      - name: Studio geography V2 — basin candidates, previews and region dry-run
        run: node tools/run-browser-check.mjs studio-geography-v2
      - name: Natural structures Studio acceptance (arch, tunnel, 3D preview and export)
        run: node tools/run-browser-check.mjs studio-natural-structures
      - name: Studio creation acceptance (walls, vegetation, reusable assemblies)
        run: node tools/run-browser-check.mjs studio-creation-acceptance
      - name: Inspector input persistence browser checks
        run: |
          node tools/run-browser-check.mjs inspector-editing
          node tools/run-browser-check.mjs inspector-edit
      - name: Studio 3D editor browser checks
        run: node tools/run-browser-check.mjs editor
      - name: Studio content authoring browser checks
        run: node tools/run-browser-check.mjs editor-content
      - name: Studio world features browser checks
        run: node tools/run-browser-check.mjs editor-world
      - name: Studio universal selection browser checks (E7)
        run: node tools/run-browser-check.mjs selection
      - name: Paths network browser checks (E8)
        run: node tools/run-browser-check.mjs paths
      - name: Geographic editing browser checks (E9)
        run: node tools/run-browser-check.mjs geo-edit
      - name: Local lighting browser checks (E10)
        run: node tools/run-browser-check.mjs lights
      - name: B1 acceptance walk — obstacles, water, mine, farm, saves (PHYS/WATER/MINE/AGRI)
        run: node tools/run-browser-check.mjs b1
      - name: World Production landscapes and asset library
        run: node tools/run-browser-check.mjs landscapes
      - name: Economy — counter, axe, felling, selling (island)
        run: node tools/run-browser-check.mjs economy
      - name: Cliff climbing (island)
        run: node tools/run-browser-check.mjs climb
      - name: Hamster player (roll, glide, tools, fishing)
        run: node tools/run-browser-check.mjs hamster
      - name: Near trees and rocks stay drawn (cache eviction)
        run: node tools/run-browser-check.mjs dressing-stability
      - name: Docks and boats (walk on docks, board moored boats)
        run: node tools/run-browser-check.mjs boats
      - name: Swimming and diving (half-submerged, Space dives, camera-steered)
        run: node tools/run-browser-check.mjs swim
      - name: B1 Studio edits and « Jouer ici »
        run: node tools/run-browser-check.mjs b1-studio
      - name: IndexedDB integration
        run: |
          npm run dev -- --host 127.0.0.1 --port 5189 --strictPort > /tmp/little-world-studio-dev.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5189/little-world/ > /dev/null; then break; fi
            sleep 1
          done
          node tools/run-browser-check.mjs storage http://127.0.0.1:5189/little-world/
          node tools/run-browser-check.mjs audio-engine http://127.0.0.1:5189/little-world/
          node tools/run-browser-check.mjs audio-v2 http://127.0.0.1:5189/little-world/
          node tools/run-browser-check.mjs audio-production http://127.0.0.1:5189/little-world/
          node tools/run-browser-check.mjs water-engine http://127.0.0.1:5189/little-world/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-artifacts
          path: /tmp/little-world-browser
