name: Studio natural structures — fast acceptance
on:
  push:
    branches:
      - feat/studio-creation-workflows-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  natural:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Natural geometry and collision unit tests
        run: node --experimental-strip-types --test tests/studio-natural-structures.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/little-world-natural-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/little-world/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/little-world/ > /dev/null
      - name: Natural structures Studio browser acceptance
        run: node tools/run-browser-check.mjs studio-natural-structures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: natural-structure-screenshots
          path: /tmp/little-world-browser/studio-natural-*.png
