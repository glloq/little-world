name: Temporary V-glider character atlas regeneration
on:
  push:
    branches: [feat/backpack-v-glider]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Regenerate character atlas (not other atlas groups)
        env:
          IMPOSTOR_GROUP: characters
        run: node tools/generate-impostors.mjs
      - name: Commit generated atlas and manifest to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/impostors/
          if ! git diff --cached --quiet; then
            git commit -m "assets: regenerate hamster character impostor for backpack V-glider"
            git push origin HEAD:feat/backpack-v-glider
          fi
