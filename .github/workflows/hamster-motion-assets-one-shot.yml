name: Regenerate hamster motion visual assets
on:
  push:
    branches: [feat/hamster-motion-v2]
permissions:
  contents: write
concurrency:
  group: hamster-motion-assets-v21
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run assets:hamster
      - run: IMPOSTOR_GROUP=characters npm run generate:impostors
      - name: Commit GLB and character atlas on current branch
        run: |
          git add public/models/hamster.glb public/impostors/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(hamster): regenerate V2.1 GLB and character atlas"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
