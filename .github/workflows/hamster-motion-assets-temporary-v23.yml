name: Temporary hamster V2.3 visual assets
on:
  push:
    branches: [feat/hamster-motion-v2]
permissions:
  contents: write
concurrency:
  group: hamster-v23-visual-assets
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run assets:hamster
      - run: IMPOSTOR_GROUP=characters npm run generate:impostors
      - name: Commit deterministic model and atlas
        run: |
          git add public/models/hamster.glb public/impostors/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(hamster): regenerate V2.3 reference model and character impostors'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
