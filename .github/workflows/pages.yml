name: Build and deploy Little World

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Verify static output
        run: |
          test -f dist/index.html
          test -f dist/editor/index.html
          test -d dist/assets
          test -f dist/models/pine.glb
          test -f dist/models/rock.glb
          test -f dist/models/crate.glb
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
