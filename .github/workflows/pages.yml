name: Build and deploy Little World

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Also restore the compiled site after a legacy Pages build (including manual reruns).
  workflow_run:
    workflows: ['pages build and deployment', 'pages-build-deployment']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Inspect Pages publishing mode
        uses: actions/github-script@v7
        with:
          script: |
            const {ensureWorkflowPages} = await import(`${process.env.GITHUB_WORKSPACE}/tools/pages-source.mjs`);
            await ensureWorkflowPages({github, context, core});
      - name: Unit tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Identify the published revision
        run: printf '{"revision":"%s"}\n' "$GITHUB_SHA" > dist/deployment.json
      - name: Verify static output
        run: node tools/verify-static-build.mjs
      - name: Check application startup on the production build
        run: |
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/little-world-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/little-world/ > /dev/null; then break; fi
            sleep 1
          done
          node tools/test-published-browser.mjs http://127.0.0.1:5173/little-world/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Wait for competing source publications
        uses: actions/github-script@v7
        with:
          script: |
            const {waitForLegacyPages} = await import(`${process.env.GITHUB_WORKSPACE}/tools/pages-source.mjs`);
            await waitForLegacyPages({github, context, core});
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public game, Studio and editor
        env:
          WORLD_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          npx playwright install --with-deps chromium
          # Allow bounded propagation through the Pages CDN, but keep a real failure red.
          for attempt in 1 2 3; do
            if node tools/test-published-browser.mjs; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-browser-artifacts
          path: /tmp/little-world-browser
