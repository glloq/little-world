<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#d9e6ce" />
  <title>Little World — L’île de l’écureuil volant</title>
</head>
<body class="game-page">
  <div id="app">
    <div id="viewport"></div>
    <!-- Developer panel (technical statistics): hidden unless developer mode (Paramètres, ?metrics or ?dev). -->
    <aside class="hud-debug dev-only" aria-label="Performances de développement" aria-live="off">
      <span id="dev-speed">Vitesse : —</span>
      <span id="fps">FPS : —</span>
      <span id="memory">Mémoire : —</span>
    </aside>
    <!-- Render quality selector, shown in Paramètres › Affichage. -->
    <div id="ui-templates" hidden>
      <select id="quality" aria-label="Qualité du rendu">
        <option value="low">Économie</option>
        <option value="medium" selected>Équilibré</option>
        <option value="high">Élevée</option>
      </select>
    </div>
    <aside id="appearance-menu" class="appearance-menu panel hide" aria-hidden="true" aria-label="Personnalisation de l'écureuil">
      <div class="appearance-heading">
        <div>
          <div class="section-kicker">MON ÉCUREUIL</div>
          <h2>Accessoires &amp; émotions</h2>
          <p>Choisis un style tout en maintenant <kbd>A</kbd>.</p>
        </div>
        <div class="appearance-key"><kbd>A</kbd><small>maintenir</small></div>
      </div>
      <div class="appearance-columns">
        <section aria-label="Accessoires">
          <h3>Accessoires</h3>
          <div id="appearance-accessories" class="appearance-options"></div>
        </section>
        <section aria-label="Émotions">
          <h3>Émotions</h3>
          <div id="appearance-emotions" class="appearance-options"></div>
        </section>
      </div>
      <p class="appearance-footer">Les choix sont conservés automatiquement dans ce navigateur. Relâche <kbd>A</kbd> pour reprendre l’exploration.</p>
    </aside>
    <div id="action" class="ui-prompt hide" role="status" aria-live="polite"></div>
    <div id="start-overlay" class="start-overlay" aria-busy="true">
      <div class="start-card">
        <div class="start-hamster" aria-hidden="true">
          <svg viewBox="0 0 180 155" xmlns="http://www.w3.org/2000/svg" focusable="false">
            <path fill="currentColor" d="M48 52C30 43 26 17 39 12c16-7 32 13 34 33h34c5-23 23-38 36-30 13 9 5 33-11 42 14 13 23 32 23 52 0 28-30 43-65 43-40 0-68-17-68-45 0-23 10-41 26-55Z"/>
            <ellipse cx="49" cy="138" rx="23" ry="12" fill="currentColor"/>
            <ellipse cx="131" cy="138" rx="23" ry="12" fill="currentColor"/>
            <ellipse cx="36" cy="108" rx="17" ry="13" fill="currentColor"/>
            <ellipse cx="145" cy="108" rx="17" ry="13" fill="currentColor"/>
            <circle cx="68" cy="77" r="5" class="start-hamster-eye"/>
            <circle cx="113" cy="77" r="5" class="start-hamster-eye"/>
            <path d="m85 92 5 5 5-5Z" class="start-hamster-nose"/>
          </svg>
        </div>
        <div class="start-error" role="alert" hidden>
          <h1>Impossible d’ouvrir cette partie</h1>
          <p></p>
        </div>
        <button id="start" class="primary-button" type="button" hidden disabled>Reprendre l’exploration</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
